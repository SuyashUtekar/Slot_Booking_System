services:
  - type: web
    name: slot-registration-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: EVENT_NAME
        value: Venue Visit Registration
      - key: EVENT_TIMEZONE
        value: Asia/Kolkata
      - key: MAX_GUESTS_PER_REGISTRATION
        value: "15"
      - key: DEFAULT_SLOT_START_TIME
        value: "10:00"
      - key: DEFAULT_SLOT_END_TIME
        value: "18:00"
      - key: DEFAULT_SLOT_CAPACITY
        value: "150"
      - key: DEFAULT_SLOT_DATE
        sync: false
      - key: EXPORT_PATH
        value: /tmp/registrations.xlsx

  - type: web
    name: slot-registration-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
